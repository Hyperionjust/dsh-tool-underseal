name: ci

# Validates the package against the PUBLISHED @deepseek-ai/* types (not a
# monorepo checkout): `npm install` resolves the peer/dev ranges from the npm
# registry, `npm run build` type-checks src/ strictly, and the guard/sentinel
# suites run against the compiled lib/. A red build here is the earliest
# signal of "published-line drift" (README § Known Limitations).

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node tests/run-guard-tests.mjs
      - run: node tests/run-sentinel-tests.mjs
